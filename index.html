<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Headache Log</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #EEF0EA;
    --card: #FFFFFF;
    --ink: #232821;
    --ink-soft: #5B6259;
    --accent: #2F5D50;
    --accent-soft: #DCE6DF;
    --alert: #8B3A3A;
    --alert-soft: #F3E1DD;
    --line: #D8DCCF;
    --amber: #A67C2E;
    --amber-soft: #F1E7D2;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(circle, rgba(47,93,80,0.08) 1px, transparent 1px) 0 0/22px 22px,
      var(--bg);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    min-height:100vh;
    padding-bottom:84px;
  }
  h1,h2,h3,.serif{font-family:'Newsreader',serif;}
  .app{max-width:520px;margin:0 auto;padding:20px 16px 8px;}
  header.top{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:18px;}
  header.top h1{font-size:1.5rem;font-weight:600;margin:0;color:var(--ink);}
  header.top .date{font-size:0.85rem;color:var(--ink-soft);}
  .card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:14px;
    padding:20px;
    margin-bottom:14px;
  }
  .progress{display:flex;gap:5px;margin-bottom:18px;}
  .progress .dot{flex:1;height:4px;border-radius:2px;background:var(--line);}
  .progress .dot.done{background:var(--accent);}
  .progress .dot.current{background:var(--amber);}
  .qtitle{font-family:'Newsreader',serif;font-size:1.25rem;font-weight:500;margin:0 0 4px;line-height:1.3;}
  .qhint{font-size:0.85rem;color:var(--ink-soft);margin:0 0 16px;}
  .pillrow{display:flex;flex-wrap:wrap;gap:8px;}
  .pill{
    border:1.5px solid var(--line);
    background:#fff;
    border-radius:10px;
    padding:11px 16px;
    font-size:0.95rem;
    font-family:'Inter',sans-serif;
    color:var(--ink);
    cursor:pointer;
    flex:1 1 auto;
    text-align:center;
    min-width:64px;
    transition:border-color .15s, background .15s;
  }
  .pill.selected{border-color:var(--accent);background:var(--accent-soft);font-weight:600;}
  .pill.alert-selected{border-color:var(--alert);background:var(--alert-soft);font-weight:600;}
  .pill.small{padding:9px 10px;font-size:0.88rem;flex:0 0 auto;}
  .scale{display:flex;gap:6px;}
  .scale .pill{flex:1;padding:10px 0;}
  .navrow{display:flex;justify-content:space-between;align-items:center;margin-top:22px;gap:10px;}
  button.primary{
    background:var(--accent);color:#fff;border:none;border-radius:10px;
    padding:12px 22px;font-size:0.95rem;font-weight:600;font-family:'Inter',sans-serif;
    cursor:pointer;flex:1;
  }
  button.primary:disabled{opacity:0.4;cursor:default;}
  button.ghost{
    background:none;border:none;color:var(--ink-soft);font-size:0.9rem;
    cursor:pointer;padding:12px 8px;font-family:'Inter',sans-serif;
  }
  .checklist{display:flex;flex-direction:column;gap:0;}
  .checklist .cat{font-size:0.78rem;text-transform:none;color:var(--ink-soft);margin:14px 0 6px;font-weight:600;}
  .checklist .cat:first-child{margin-top:0;}
  .checkrow{
    display:flex;align-items:center;gap:10px;padding:9px 2px;border-bottom:1px solid var(--line);
    cursor:pointer;font-size:0.93rem;
  }
  .checkrow:last-child{border-bottom:none;}
  .checkrow .box{width:19px;height:19px;border:1.5px solid var(--line);border-radius:5px;flex-shrink:0;position:relative;}
  .checkrow.checked .box{background:var(--accent);border-color:var(--accent);}
  .checkrow.checked .box::after{content:'';position:absolute;left:5px;top:2px;width:5px;height:9px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg);}
  textarea{
    width:100%;border:1.5px solid var(--line);border-radius:10px;padding:12px;
    font-family:'Inter',sans-serif;font-size:0.93rem;resize:vertical;min-height:70px;
  }
  .summarybox{border:1px dashed var(--line);border-radius:10px;padding:14px;margin-top:14px;font-size:0.88rem;color:var(--ink-soft);}
  .summarybox b{color:var(--ink);}
  .flag{display:inline-block;font-size:0.75rem;padding:2px 8px;border-radius:20px;margin-left:6px;font-weight:600;}
  .flag.watching{background:var(--amber-soft);color:var(--amber);}
  .flag.confirmed{background:var(--alert-soft);color:var(--alert);}
  .flag.ruled_out{background:var(--accent-soft);color:var(--accent);}
  nav.tabs{
    position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);
    display:flex;max-width:520px;margin:0 auto;
  }
  nav.tabs button{
    flex:1;background:none;border:none;padding:12px 0 10px;font-family:'Inter',sans-serif;
    font-size:0.78rem;color:var(--ink-soft);cursor:pointer;
  }
  nav.tabs button.active{color:var(--accent);font-weight:600;}
  .statgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px;}
  .stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;}
  .stat .n{font-family:'Newsreader',serif;font-size:1.7rem;font-weight:600;}
  .stat .l{font-size:0.78rem;color:var(--ink-soft);}
  .trigrow{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);}
  .trigrow:last-child{border-bottom:none;}
  .trigrow .name{font-size:0.92rem;}
  .trigrow .rate{font-size:0.8rem;color:var(--ink-soft);}
  .sectionlabel{font-size:0.95rem;font-weight:600;margin:20px 0 6px;font-family:'Newsreader',serif;}
  .empty{color:var(--ink-soft);font-size:0.88rem;padding:10px 0;}
  .addbtn{width:100%;border:1.5px dashed var(--line);background:none;border-radius:10px;padding:10px;color:var(--ink-soft);font-family:'Inter',sans-serif;cursor:pointer;margin-top:6px;}
  .toprow{display:flex;justify-content:space-between;align-items:center;}
  .linkbtn{background:none;border:none;color:var(--accent);font-size:0.85rem;font-weight:600;cursor:pointer;font-family:'Inter',sans-serif;}
  .histentry{padding:10px 0;border-bottom:1px solid var(--line);font-size:0.88rem;display:flex;justify-content:space-between;}
  .histentry .d{color:var(--ink-soft);}
  input[type=text]{width:100%;border:1.5px solid var(--line);border-radius:10px;padding:11px;font-family:'Inter',sans-serif;font-size:0.93rem;}
</style>
</head>
<body>
<div class="app" id="app"></div>

<nav class="tabs">
  <button id="tab-checkin" onclick="setTab('checkin')">Check-in</button>
  <button id="tab-insights" onclick="setTab('insights')">Patterns</button>
  <button id="tab-history" onclick="setTab('history')">History</button>
</nav>

<script>
/* ---------------- Trigger pool ---------------- */
const POOL = [
  {id:'chocolate', name:'Chocolate', cat:'Food'},
  {id:'aged_cheese', name:'Aged cheese', cat:'Food'},
  {id:'cured_meat', name:'Cured / processed meat', cat:'Food'},
  {id:'msg', name:'MSG / savory seasoning packets', cat:'Food'},
  {id:'artificial_sweetener', name:'Artificial sweetener', cat:'Food'},
  {id:'citrus', name:'Citrus fruit', cat:'Food'},
  {id:'nuts', name:'Nuts', cat:'Food'},
  {id:'fermented', name:'Fermented food (kimchi, sauerkraut, soy sauce)', cat:'Food'},
  {id:'oily_fish', name:'Oily fish (sardines, mackerel, anchovies)', cat:'Food'},
  {id:'onions', name:'Onions', cat:'Food'},
  {id:'tomatoes', name:'Tomatoes', cat:'Food'},
  {id:'wheat', name:'Wheat / gluten', cat:'Food', nearDaily:true},
  {id:'dairy', name:'Dairy', cat:'Food', nearDaily:true},
  {id:'skipped_meal', name:'Skipped a meal', cat:'Food'},
  {id:'more_caffeine', name:'More caffeine than usual', cat:'Drink'},
  {id:'less_caffeine', name:'Less caffeine than usual', cat:'Drink'},
  {id:'perfume', name:'Strong perfume / fragrance exposure', cat:'Environment'},
  {id:'bright_light', name:'Bright or flickering light', cat:'Environment'},
  {id:'loud_noise', name:'Loud noise', cat:'Environment'},
  {id:'screen_glare', name:'Screen glare / eye strain', cat:'Environment'},
  {id:'weather_change', name:'Weather / pressure change', cat:'Environment'},
  {id:'heat', name:'Extreme heat', cat:'Environment'},
  {id:'travel', name:'Travel / flight (older entries)', cat:'Environment', hidden:true, noRank:true},
  {id:'trip_away', name:'Away from home (trip)', cat:'Environment', hidden:true},
  {id:'travel_day', name:'Travel day (in transit)', cat:'Environment', hidden:true},
  {id:'jet_lag', name:'Back home, jet-lagged', cat:'Environment', hidden:true},
  {id:'posture', name:'Long stretch at a desk / poor posture', cat:'Lifestyle'},
  {id:'neck_strain', name:'Neck or shoulder strain', cat:'Lifestyle'},
  {id:'intense_exercise', name:'Unusually intense exercise', cat:'Lifestyle'},
  {id:'hormone_change', name:'Hormone dose change or missed dose', cat:'Lifestyle'},
  {id:'patch_day', name:'Hormone patch change day', cat:'Lifestyle'},
  {id:'jaw_clenching', name:'Jaw clenching / TMJ tension', cat:'Lifestyle'},
  {id:'pain_reliever', name:'Took a pain reliever (older entries)', cat:'Lifestyle', hidden:true, noRank:true},
];
const POOL_MAP = Object.fromEntries(POOL.map(p=>[p.id,p]));
const CATS = ['Food','Drink','Environment','Lifestyle'];
// Daily checklist = everything visible except near-daily staples (no contrast to measure; test those with an elimination trial).
const POOL_CHECKLIST = POOL.filter(p=>!p.hidden && !p.nearDaily);
const POOL_PICKABLE = POOL.filter(p=>!p.hidden);
// Interleave categories (Food, Drink, Environment, Lifestyle, Food, Drink...) so the
// rotation samples across all categories quickly instead of exhausting Food first.
function interleavePool(){
  const byCat = {}; CATS.forEach(c=> byCat[c] = POOL.filter(p=>p.cat===c));
  const maxLen = Math.max(...CATS.map(c=>byCat[c].length));
  const out = [];
  for(let i=0;i<maxLen;i++){ CATS.forEach(c=>{ if(byCat[c][i]) out.push(byCat[c][i]); }); }
  return out;
}
const INTERLEAVED_POOL = interleavePool();

/* ---------------- Statistics engine ----------------
   Beta-Binomial Bayesian analysis (uniform Beta(1,1) prior) with episode
   collapsing: consecutive headache days are treated as ONE occasion, so a
   3-day headache streak where you happened to eat the same thing each day
   only counts as one confirming data point, not three. */

// Lanczos approximation to log-gamma, needed for the incomplete beta function.
function logGamma(x){
  const g = 7;
  const c = [0.99999999999980993,676.5203681218851,-1259.1392167224028,771.32342877765313,
    -176.61502916214059,12.507343278686905,-0.13857109526572012,9.9843695780195716e-6,1.5056327351493116e-7];
  if(x<0.5) return Math.log(Math.PI/Math.sin(Math.PI*x)) - logGamma(1-x);
  x-=1;
  let a=c[0];
  const t=x+g+0.5;
  for(let i=1;i<g+2;i++) a+=c[i]/(x+i);
  return 0.5*Math.log(2*Math.PI)+(x+0.5)*Math.log(t)-t+Math.log(a);
}
function betacf(x,a,b){
  const MAXIT=200, EPS=3e-7, FPMIN=1e-30;
  const qab=a+b, qap=a+1, qam=a-1;
  let c=1, d=1-qab*x/qap;
  if(Math.abs(d)<FPMIN) d=FPMIN;
  d=1/d; let h=d;
  for(let m=1;m<=MAXIT;m++){
    const m2=2*m;
    let aa=m*(b-m)*x/((qam+m2)*(a+m2));
    d=1+aa*d; if(Math.abs(d)<FPMIN) d=FPMIN;
    c=1+aa/c; if(Math.abs(c)<FPMIN) c=FPMIN;
    d=1/d; h*=d*c;
    aa=-(a+m)*(qab+m)*x/((a+m2)*(qap+m2));
    d=1+aa*d; if(Math.abs(d)<FPMIN) d=FPMIN;
    c=1+aa/c; if(Math.abs(c)<FPMIN) c=FPMIN;
    d=1/d;
    const del=d*c; h*=del;
    if(Math.abs(del-1)<EPS) break;
  }
  return h;
}
function betai(x,a,b){ // regularized incomplete beta I_x(a,b)
  if(x<=0) return 0; if(x>=1) return 1;
  const bt=Math.exp(logGamma(a+b)-logGamma(a)-logGamma(b)+a*Math.log(x)+b*Math.log(1-x));
  return x < (a+1)/(a+b+2) ? bt*betacf(x,a,b)/a : 1-bt*betacf(1-x,b,a)/b;
}
function betaQuantile(p,a,b){ // inverse CDF via bisection
  let lo=0, hi=1;
  for(let i=0;i<50;i++){ const mid=(lo+hi)/2; if(betai(mid,a,b)<p) lo=mid; else hi=mid; }
  return (lo+hi)/2;
}
function betaPosterior(k,n){ // Beta(1,1) prior -> posterior Beta(1+k, 1+n-k)
  const a=1+k, b=1+(n-k);
  return { k, n, mean: a/(a+b), low: n>0?betaQuantile(0.05,a,b):0, high: n>0?betaQuantile(0.95,a,b):1 };
}

function daysBetweenDates(d1,d2){ return Math.round((new Date(d2+'T00:00:00')-new Date(d1+'T00:00:00'))/86400000); }

// ---- What counts as a headache, and how days are paired with exposures ----
const MOD_SEV = 3;
function minSev(){ return (STORE.settings && STORE.settings.minSeverity) || 3; }
// Needing a pain reliever means it was bothersome, whatever number it got (older entries logged this as an item).
function tookMed(l){
  return !!(l && ((l.headache && Array.isArray(l.headache.meds) && l.headache.meds.length>0) || (l.exposures && l.exposures.pain_reliever===true)));
}
function isModerate(l){
  if(!l || !l.headache || !l.headache.had) return false;
  const sv = l.headache.severity;
  return sv==null || sv>=MOD_SEV || tookMed(l);
}
function isCounted(l){
  if(!l || !l.headache || !l.headache.had) return false;
  return minSev()<=1 ? true : isModerate(l);
}
// "Woke with it": new entries say so directly; older entries fall back to an onset clock time before 9am.
function wokeWithIt(l){
  const h = l && l.headache; if(!h) return false;
  if(h.onsetSinceWake) return h.onsetSinceWake==='woke';
  if(h.onsetTime){ const [a,b] = h.onsetTime.split(':').map(Number); return a*60+b < 9*60; }
  return false;
}
function shiftDate(d, n){ const x = new Date(d+'T00:00:00'); x.setDate(x.getDate()+n); return todayStr(x); }
function prevDate(d){ return shiftDate(d,-1); }
function nextDate(d){ return shiftDate(d,1); }

// One unit per "exposure day". The outcome is whether a NEW headache begins after that day's exposures:
//  - later the same day, or
//  - as a woke-with-it headache the next morning (it can't have been caused by that day's meals, so the
//    previous day's entry is the one it gets paired with).
// Continuation days and woke-with-it days are not units (headache already under way). A day whose next day
// isn't logged yet can't be resolved, so it waits.
function buildOccasions(logs){
  const dates = Object.keys(logs).sort();
  const isStart = d => {
    const l = logs[d]; if(!isCounted(l)) return false;
    const pl = logs[prevDate(d)];
    const prevCounted = pl && isCounted(pl);
    return !(prevCounted && l.headache.continuation !== false);
  };
  const units = [];
  dates.forEach(d=>{
    const l = logs[d];
    if(isCounted(l)){
      if(!isStart(d)) return;
      if(wokeWithIt(l)) return;
      units.push({headache:true, dates:[d]});
      return;
    }
    const n = nextDate(d);
    if(!logs[n]) return;
    const nl = logs[n];
    units.push({headache: !!(isCounted(nl) && isStart(n) && wokeWithIt(nl)), dates:[d]});
  });
  return units;
}
function allTriggerIds(logs){
  const ids = new Set(Object.keys(STORE.watchlist||{}));
  Object.values(logs).forEach(l=>Object.keys(l.exposures||{}).forEach(id=>ids.add(id)));
  return [...ids].filter(id=>!(POOL_MAP[id] && POOL_MAP[id].noRank));
}
function episodeExposureValue(dates, logs, id){
  let sawFalse=false;
  for(const d of dates){
    const v = logs[d].exposures && logs[d].exposures[id];
    if(v===true) return true;
    if(v===false) sawFalse=true;
  }
  return sawFalse ? false : undefined;
}

// Compares P(headache | exposed) vs P(headache | not exposed) for one trigger,
// using Bayesian credible intervals rather than raw counts.
function triggerStats(logs, id){
  const occasions = buildOccasions(logs);
  let k1=0,n1=0,k0=0,n0=0;
  occasions.forEach(o=>{
    const val = episodeExposureValue(o.dates, logs, id);
    if(val===undefined) return;
    if(val){ n1++; if(o.headache) k1++; } else { n0++; if(o.headache) k0++; }
  });
  return { exposed: betaPosterior(k1,n1), unexposed: betaPosterior(k0,n0) };
}
function classifyTrigger(stats){
  const {exposed:e, unexposed:u} = stats;
  const events = e.k + u.k;                 // headaches seen at all, exposed or not
  if(e.n<3 || u.n<2) return 'watching';
  if(e.k>=2 && e.low > u.high) return 'confirmed'; // needs 2+ headaches on exposed days and non-overlapping ranges
  // "ruled out" is only meaningful once headaches have actually happened often enough to show a pattern
  if(events>=4 && e.n>=4 && e.mean <= u.mean+0.15) return 'ruled_out';
  return 'watching';
}

// Compares headache rate during an elimination window against all other logged days.
/* ---------------- Workout app integration ----------------
   The workout tracker (carthasiddiqui.github.io/Workout) stores its data
   under localStorage key 'workout_tracker_v3'. localStorage is scoped by
   ORIGIN (domain), not by folder/repo — so as long as this app is also
   hosted somewhere under carthasiddiqui.github.io, it shares the same
   storage and can read that data directly. No export/import needed. */
const WORKOUT_STORAGE_KEY = 'workout_tracker_v3';
function getWorkoutSessions(){
  try{
    const raw = localStorage.getItem(WORKOUT_STORAGE_KEY);
    if(!raw) return null; // null = not found (different origin, or workout app never opened here)
    const data = JSON.parse(raw);
    return data.sessions || [];
  }catch(e){ return null; }
}
function workoutSessionsByDate(){
  const sessions = getWorkoutSessions();
  const map = {};
  if(!sessions) return map;
  sessions.forEach(s=>{
    if(!s.date) return;
    const d = todayStr(new Date(s.date));
    map[d] = s; // last session wins if somehow two on one date
  });
  return map;
}
function getSessionVolume(session){
  return (session.supersets||[]).flatMap(ss=>ss.exercises||[]).reduce((total,ex)=>
    total + (ex.sets||[]).reduce((a,set)=>a+((set.weight||0)*(set.reps||0)),0), 0);
}
// Headache rate on workout days vs rest days, overall and by gym mode — same
// episode-collapsing logic as food/environment triggers, for consistency.
function workoutStats(logs){
  const byDate = workoutSessionsByDate();
  const occasions = buildOccasions(logs);
  function statsFor(matchFn){
    let k1=0,n1=0,k0=0,n0=0;
    occasions.forEach(o=>{
      const matched = o.dates.some(d=>byDate[d] && matchFn(byDate[d]));
      if(matched){ n1++; if(o.headache) k1++; } else { n0++; if(o.headache) k0++; }
    });
    return { exposed: betaPosterior(k1,n1), unexposed: betaPosterior(k0,n0) };
  }
  return {
    any: statsFor(()=>true),
    home: statsFor(s=>s.gymMode==='home'),
    away: statsFor(s=>s.gymMode==='away'),
    jubail: statsFor(s=>s.gymMode==='jubail'),
  };
}

function trialStats(logs, trial){
  const inTrial = d => d>=trial.startDate && (!trial.endDate || d<=trial.endDate);
  const dates = Object.keys(logs);
  const trialDates = dates.filter(inTrial);
  const otherDates = dates.filter(d=>!inTrial(d));
  const k1 = trialDates.filter(d=>isCounted(logs[d])).length;
  const k0 = otherDates.filter(d=>isCounted(logs[d])).length;
  return { trial: betaPosterior(k1, trialDates.length), baseline: betaPosterior(k0, otherDates.length) };
}

/* ---------------- Data layer ----------------
   Runs as a normal webpage (GitHub Pages), so real localStorage is reliable —
   same approach as the workout app. Everything lives under one key. */
const STORAGE_KEY = 'headache_tracker_v1';
function loadStore(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    return raw ? JSON.parse(raw) : {logs:{}, watchlist:{}, rotation:{index:0}, trials:[]};
  }catch(e){ return {logs:{}, watchlist:{}, rotation:{index:0}, trials:[]}; }
}
let STORE = loadStore();
STORE.trials = STORE.trials || [];
STORE.watchlist = STORE.watchlist || {};
STORE.logs = STORE.logs || {};
STORE.rotation = STORE.rotation || {index:0};
STORE.appliedDefaults = STORE.appliedDefaults || {};
STORE.settings = STORE.settings || {};
if(!STORE.settings.minSeverity) STORE.settings.minSeverity = 3;
// custom items live in the watchlist; make sure they resolve to names after a reload
Object.values(STORE.watchlist).forEach(x=>{ if(x && x.custom && !POOL_MAP[x.id]) POOL_MAP[x.id] = {id:x.id, name:x.name, cat:'Food'}; });
if(!STORE.appliedDefaults.v2){
  // pain relievers are now logged as medication on headache days, and travel via the trip step
  delete STORE.watchlist['pain_reliever']; delete STORE.watchlist['travel'];
  STORE.appliedDefaults.v2 = true;
  persist();
}
if(!STORE.appliedDefaults.pinNuts){
  if(!STORE.watchlist['nuts']) STORE.watchlist['nuts'] = {id:'nuts', name:POOL_MAP['nuts'].name, added:todayStr(), lastAsked:'2000-01-01'};
  STORE.watchlist['nuts'].pinned = true;
  STORE.appliedDefaults.pinNuts = true;
  persist();
}
function persist(){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(STORE)); return true; }
  catch(e){ console.error('localStorage save failed', e); return false; }
}
async function getWatchlist(){ return STORE.watchlist; }
async function saveWatchlist(w){ STORE.watchlist = w; return persist(); }
async function getAllLogs(){ return STORE.logs; }
async function getRotationState(){ return STORE.rotation; }
async function saveRotationState(s){ STORE.rotation = s; persist(); }

function todayStr(d=new Date()){
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function daysAgo(dateStr){
  const d1 = new Date(dateStr+'T00:00:00'), d2 = new Date(todayStr()+'T00:00:00');
  return Math.round((d2-d1)/86400000);
}
function yesterdayStr(refDate){
  const d = refDate? new Date(refDate+'T00:00:00') : new Date();
  d.setDate(d.getDate()-1); return todayStr(d);
}
function hadHeadacheYesterday(){
  const ref = (WIZ && WIZ.editDate) ? WIZ.editDate : undefined;
  const y = STORE.logs[yesterdayStr(ref)];
  return !!(y && y.headache && y.headache.had);
}

/* ---------------- Backup export / import (optional — for switching devices or extra safety) ---------------- */
function exportBackup(){
  const payload = { version:2, exportedAt: new Date().toISOString(), logs: STORE.logs, watchlist: STORE.watchlist, rotation: STORE.rotation, trials: STORE.trials, settings: STORE.settings, appliedDefaults: STORE.appliedDefaults };
  const blob = new Blob([JSON.stringify(payload, null, 2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'headache-backup-'+todayStr()+'.json';
  a.click();
}
function triggerImport(){ document.getElementById('backupFileInput').click(); }
function importBackup(input){
  const file = input.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = (e)=>{
    try{
      const data = JSON.parse(e.target.result);
      if(!confirm('This will replace what is currently stored on this device with the backup file. Continue?')) return;
      STORE.logs = data.logs || {};
      STORE.watchlist = data.watchlist || {};
      STORE.rotation = data.rotation || {index:0};
      STORE.trials = data.trials || [];
      STORE.settings = data.settings || {minSeverity:3};
      if(data.appliedDefaults) STORE.appliedDefaults = data.appliedDefaults;
      persist();
      WIZ = null;
      render();
    }catch(err){
      alert('That file could not be read as a backup. Make sure it is the JSON file this app exported.');
    }
  };
  reader.readAsText(file);
}

/* ---------------- App state ---------------- */
let TAB = 'checkin';
let LOGS = {};
let WATCHLIST = {};
let WIZ = null; // wizard state

function setTab(t){ TAB = t; render(); }

/* ---------------- Wizard construction ---------------- */
async function buildWizard(){
  const w = await getWatchlist();
  const logs = await getAllLogs();
  const askable = id => POOL_MAP[id] && !POOL_MAP[id].hidden;

  const pinned = Object.keys(w).filter(id=>w[id].pinned && askable(id));
  const activeTrialIds = STORE.trials.filter(t=>!t.endDate).flatMap(t=>t.itemIds).filter(askable);
  const alwaysAsk = [...new Set([...pinned, ...activeTrialIds])];

  // A few current suspects get a direct yes/no; everything else is covered by the daily checklist.
  const watching = Object.keys(w)
    .filter(id => askable(id) && !POOL_MAP[id].nearDaily && !alwaysAsk.includes(id))
    .filter(id => { const st = classifyTrigger(triggerStats(logs, id)); return st==='watching' || st==='confirmed'; })
    .sort((a,b)=> (w[a].lastAsked||'').localeCompare(w[b].lastAsked||''))
    .slice(0,4);

  const watchIds = [...alwaysAsk, ...watching];

  const steps = [];
  steps.push({type:'headache'});
  steps.push({type:'trip'});
  steps.push({type:'sleep'});
  steps.push({type:'pillow'});
  steps.push({type:'stress'});
  steps.push({type:'water'});
  steps.push({type:'caffeine'});
  watchIds.forEach(id=> steps.push({type:'trigger', id}));
  steps.push({type:'daily_checklist'});
  steps.push({type:'notes'});
  steps.push({type:'done'});
  return steps;
}

async function startCheckin(dateOverride){
  const steps = await buildWizard();
  const prevLog = STORE.logs[yesterdayStr(dateOverride || undefined)];
  const tripDefault = (prevLog && (prevLog.trip==='away' || prevLog.trip==='recovering')) ? prevLog.trip : undefined;
  WIZ = { steps, i:0, answers:{ exposures:{}, checklist:[], trip: tripDefault }, editDate: dateOverride || null };
  TAB = 'checkin';
  render();
}
// Entry point for "log a specific day" — routes to the full review flow if
// that day already has an entry, or a fresh smart check-in targeting that date if not.
function startCheckinForDate(date){
  if(!date) return;
  if(STORE.logs[date]) startEditDay(date);
  else startCheckin(date);
}

function currentStep(){ return WIZ.steps[WIZ.i]; }

function goNext(){
  if(WIZ.i < WIZ.steps.length-1){ WIZ.i++; render(); }
}
function goBack(){ if(WIZ.i>0){ WIZ.i--; render(); } }

async function finishCheckin(){
  const date = WIZ.editDate || todayStr();
  const a = WIZ.answers;
  const sevNum = a.severity || 5;
  const log = {
    date,
    headache: a.headache ? {had:true, severity:sevNum, onsetSinceWake:a.onsetSinceWake||null, onsetTime:a.onsetTime||'',
      continuation: a.continuation===undefined? null : a.continuation, meds: a.meds||[], medHelped: a.medHelped||null} : {had:false},
    sleepScore: a.sleepScore, pillow: a.pillow, trip: a.trip||null,
    stress: a.stress, water: a.water, caffeine: a.caffeine, caffeineChange: a.caffeineChange,
    notes: a.notes || ''
  };

  const w = await getWatchlist();
  const logsBefore = await getAllLogs();

  // Fresh check-in: the checklist is shown every day, so anything not ticked counts as "no".
  // (Same list on headache and non-headache days, so both are treated alike.)
  if(Array.isArray(a.checklist)){
    const ticked = new Set(a.checklist);
    POOL_CHECKLIST.forEach(p=>{ if(a.exposures[p.id]===undefined) a.exposures[p.id] = ticked.has(p.id); });
  }
  // Trip status becomes factors the stats engine can compare like any other
  if(a.trip){
    a.exposures.trip_away = (a.trip==='away' || a.trip==='transit');
    a.exposures.travel_day = (a.trip==='transit');
    a.exposures.jet_lag = (a.trip==='recovering');
  }

  // Directly-asked items: keep them registered and note when they were last asked
  WIZ.steps.filter(s=>s.type==='trigger').forEach(s=>{
    if(!w[s.id]) w[s.id] = {id:s.id, name:POOL_MAP[s.id]?.name||s.id, added:date, lastAsked:date};
    else w[s.id].lastAsked = date;
  });
  // On a meaningful-headache day, anything marked yes becomes a suspect
  if(a.headache && sevNum >= minSev()){
    Object.keys(a.exposures).forEach(id=>{
      const pm = POOL_MAP[id];
      if(a.exposures[id]===true && pm && !pm.hidden && !pm.nearDaily && !w[id]) w[id] = {id, name:pm.name, added:date, lastAsked:date};
    });
  }
  log.exposures = a.exposures;

  const beforeStatus = {};
  Object.keys(w).forEach(id=> beforeStatus[id] = classifyTrigger(triggerStats(logsBefore, id)));

  const watchlistOk = await saveWatchlist(w);
  STORE.logs[date] = log;
  const logOk = persist();

  const logsAfter = await getAllLogs();
  const changes = [];
  Object.keys(w).forEach(id=>{
    const after = classifyTrigger(triggerStats(logsAfter, id));
    if(after !== beforeStatus[id]){
      const name = w[id].name;
      if(after==='confirmed') changes.push(name+' is now showing a real pattern with your headaches.');
      else if(after==='ruled_out') changes.push(name+' looks unlikely as a trigger — moved off daily tracking.');
      else if(beforeStatus[id]==='ruled_out') changes.push(name+' is back under watch — new data shifted the picture.');
    }
  });
  if(a.headache && wokeWithIt(log) && !STORE.logs[prevDate(date)]){
    changes.push('This headache started when you woke up, but yesterday has no entry — log yesterday so it can be paired with what happened that day.');
  }

  WIZ.savedChanges = changes;
  WIZ.saveFailed = !(watchlistOk && logOk);
  WIZ.i = WIZ.steps.length-1; // jump to done
  render();
}

/* ---------------- Rendering ---------------- */
function pill(label, selected, onclick, extraClass=''){
  return `<div class="pill ${selected?('selected '+extraClass):''}" onclick="${onclick}">${label}</div>`;
}

async function render(){
  const app = document.getElementById('app');
  document.getElementById('tab-checkin').classList.toggle('active', TAB==='checkin');
  document.getElementById('tab-insights').classList.toggle('active', TAB==='insights');
  document.getElementById('tab-history').classList.toggle('active', TAB==='history');

  if(TAB==='checkin'){ app.innerHTML = await renderCheckin(); }
  else if(TAB==='insights'){ app.innerHTML = await renderInsights(); }
  else { app.innerHTML = await renderHistory(); }
}

          <div class="pillrow">

    body = `<p class="qtitle">Anything else today?</p>

      ${body}
      <div class="navrow">
        <button class="ghost" onclick="${WIZ.i===0? (WIZ.editDate? `WIZ=null;setTab('history')` : `WIZ=null;render()`) : 'goBack()'}">${WIZ.i===0?'Cancel':'Back'}</button>
        <button class="primary" ${canAdvance?'':'disabled'} onclick="${isLast? 'finishCheckin()' : 'goNext()'}">${isLast?'Save':'Next'}</button>
      </div>
    </div>`;

function stepIsAnswered(step){
  const a = WIZ.answers;
  if(step.type==='headache'){
    if(a.headache===false) return true;
    if(a.headache!==true) return false;
    const fresh = Array.isArray(a.checklist);           // false when editing an older entry
    const onsetOk = !!a.onsetSinceWake || (!fresh && !!a.onsetTime);
    const medsOk = !fresh || Array.isArray(a.meds);
    const helpOk = !fresh || !(Array.isArray(a.meds) && a.meds.length>0) || !!a.medHelped;
    return !!a.severity && onsetOk && medsOk && helpOk && (!hadHeadacheYesterday() || a.continuation!==undefined);
  }
  if(step.type==='trip') return !!a.trip || !Array.isArray(a.checklist);
  if(step.type==='sleep') return a.sleepScore!==undefined && a.sleepScore!==null;
  if(step.type==='pillow') return !!a.pillow;
  if(step.type==='stress') return !!a.stress;
  if(step.type==='water') return !!a.water;
  if(step.type==='caffeine') return a.caffeine && a.caffeineChange;
  if(step.type==='trigger') return a.exposures[step.id]!==undefined;
  if(step.type==='daily_checklist') return true;
  if(step.type==='review_triggers') return true;
  if(step.type==='notes') return true;
  return true;
}

function setHeadache(v){ WIZ.answers.headache=v; render(); }
function setSeverity(n){ WIZ.answers.severity=n; render(); }
function setAns(k,v){ WIZ.answers[k]=v; render(); }
function enableNextIfReady(){
  const btns = document.querySelectorAll('.navrow .primary');
  const btn = btns[btns.length-1];
  if(btn) btn.disabled = !stepIsAnswered(currentStep());
}
function setExposure(id,v){ WIZ.answers.exposures[id]=v; render(); }
function toggleChecklist(id){
  if(!WIZ.answers.checklist) WIZ.answers.checklist=[];
  const arr = WIZ.answers.checklist;
  const idx = arr.indexOf(id);
  if(idx>-1) arr.splice(idx,1); else arr.push(id);
  render();
}
function setMeds(arr){ WIZ.answers.meds = arr; if(arr.length===0) WIZ.answers.medHelped = undefined; render(); }
function toggleMed(m){
  const cur = Array.isArray(WIZ.answers.meds) ? WIZ.answers.meds.slice() : [];
  const i = cur.indexOf(m); if(i>-1) cur.splice(i,1); else cur.push(m);
  WIZ.answers.meds = cur;
  if(cur.length===0) WIZ.answers.medHelped = undefined;
  render();
}
function setMinSeverity(n){ STORE.settings.minSeverity = n; persist(); render(); }

function toggleEditExposure(id){
  const cur = WIZ.answers.exposures[id];
  WIZ.answers.exposures[id] = (cur===true) ? false : true;
  render();
}

function buildEditSteps(){
  return [
    {type:'headache'}, {type:'trip'}, {type:'sleep'}, {type:'pillow'}, {type:'stress'}, {type:'water'}, {type:'caffeine'},
    {type:'review_triggers'}, {type:'notes'}, {type:'done'}
  ];
}
function startEditDay(date){
  const log = STORE.logs[date];
  if(!log) return;
  WIZ = {
    editDate: date,
    steps: buildEditSteps(),
    i: 0,
    answers: {

async function quickStats(){
  const logs = await getAllLogs();
  const entries = Object.values(logs);
  const total = entries.length;
  const withH = entries.filter(isCounted).length;
  if(total===0) return '';
  return `<div class="statgrid">
    <div class="stat"><div class="n">${total}</div><div class="l">days logged</div></div>
    <div class="stat"><div class="n">${total? Math.round(withH/total*100):0}%</div><div class="l">headache days</div></div>
  </div>`;
}

function renderOnsetCard(entries){
  const hs = entries.filter(l=>l.headache && l.headache.had);
  if(hs.length<3) return '';
  const bucket = l => {
    const h = l.headache;
    if(h.onsetSinceWake) return h.onsetSinceWake;
    if(wokeWithIt(l)) return 'woke';
    return h.onsetTime ? 'later' : 'unknown';
  };
  const labels = {woke:'Woke with it', early:'1–3h after waking', mid:'4–8h after waking', late:'9h+ after waking', later:'Later in the day (older entries, clock time only)'};
  const counts = {};
  hs.forEach(l=>{ const b = bucket(l); counts[b] = (counts[b]||0)+1; });
  const rows = Object.keys(labels).filter(k=>counts[k]).map(k=>`<div class="trigrow"><div class="name">${labels[k]}</div><div class="rate">${counts[k]} of ${hs.length}</div></div>`).join('');
  return `<div class="card">
    <div class="sectionlabel" style="margin-top:0;">When they start</div>
    ${rows}
    <p class="qhint" style="margin-top:8px;">Headaches that start on waking point to overnight factors (pillow, position, hydration, caffeine gap) rather than that day's meals, so they're paired with the previous day's entry.</p>
  </div>`;
}

function renderPillowCard(entries){
  const cats = ['All night','Part of the night','Towel roll / substitute','Not at all'];
  const rows = cats.map(c=>{
    const ls = entries.filter(l=>l.pillow===c);
    if(!ls.length) return '';
    const mod = ls.filter(isModerate).length;
    const minor = ls.filter(l=>l.headache && l.headache.had && !isModerate(l)).length;
    return `<div class="trigrow"><div class="name">${c}</div><div class="rate">${ls.length} night${ls.length===1?'':'s'}: ${mod} bothersome, ${minor} minor</div></div>`;
  }).join('');
  if(!rows) return '';
  return `<div class="card">
    <div class="sectionlabel" style="margin-top:0;">Cervical pillow vs. headaches</div>
    ${rows}
    <p class="qhint" style="margin-top:8px;">Counts the headache that followed each night (bothersome = severity 3+ or needed a pill). Small numbers, so treat it as a lead rather than a verdict — travel, hydration and an unfamiliar bed tend to come bundled with a missing pillow.</p>
  </div>`;
}

function renderMedCard(entries){
  const recent = entries.filter(l=>daysAgo(l.date)<=29);
  const usedOn = l => !!((l.headache && Array.isArray(l.headache.meds) && l.headache.meds.length) || (l.exposures && l.exposures.pain_reliever===true));
  const medDays = recent.filter(usedOn);
  if(entries.length<3) return '';
  const helped = {Yes:0, Partly:0, No:0};
  medDays.forEach(l=>{ const h=l.headache && l.headache.medHelped; if(h && helped[h]!==undefined) helped[h]++; });
  const hasHelp = helped.Yes+helped.Partly+helped.No>0;
  return `<div class="card">
    <div class="sectionlabel" style="margin-top:0;">Pain relievers</div>
    <div class="trigrow"><div class="name">Days with one, last 30 days</div><div class="rate">${medDays.length}</div></div>
    ${hasHelp? `<div class="trigrow"><div class="name">Did it help?</div><div class="rate">${helped.Yes} yes · ${helped.Partly} partly · ${helped.No} no</div></div>` : ''}
    <p class="qhint" style="margin-top:8px;">Regular use on roughly 15+ days a month (about 10+ for combination products) is where medication-overuse headache becomes a concern. ${medDays.length>=10? 'Worth raising with your doctor.' : 'You are well under that.'}</p>
  </div>`;
}

function getAllExerciseNames(){
  const sessions = getWorkoutSessions();
  if(!sessions) return [];
  const names = new Set();
  sessions.forEach(s=>{
    (s.supersets||[]).forEach(ss=>(ss.exercises||[]).forEach(ex=>{ if(ex.name) names.add(ex.name); }));
    (s.core||[]).forEach(c=>{ if(c.name) names.add(c.name); });
  });
  return [...names].sort();
}
function exerciseNamesByDate(){
  const sessions = getWorkoutSessions();
  const map = {};
  if(!sessions) return map;
  sessions.forEach(s=>{
    if(!s.date) return;
    const d = todayStr(new Date(s.date));
    if(!map[d]) map[d] = new Set();
    (s.supersets||[]).forEach(ss=>(ss.exercises||[]).forEach(ex=>{
      const performed = (ex.sets||[]).some(set=>set.done!==false);
      if(ex.name && performed) map[d].add(ex.name);
    }));
    (s.core||[]).forEach(c=>{
      const performed = (c.rounds||[]).some(r=>r.done!==false);
      if(c.name && performed) map[d].add(c.name);
    });
  });
  return map;
}
// Headache rate on days a specific exercise was performed vs. all other logged days
// (rest days AND workout days that didn't include it).
function exerciseStats(logs, name){
  const byDate = exerciseNamesByDate();
  const occasions = buildOccasions(logs);
  let k1=0,n1=0,k0=0,n0=0;
  occasions.forEach(o=>{
    const matched = o.dates.some(d=> byDate[d] && byDate[d].has(name));
    if(matched){ n1++; if(o.headache) k1++; } else { n0++; if(o.headache) k0++; }
  });
  return { exposed: betaPosterior(k1,n1), unexposed: betaPosterior(k0,n0) };
}

function renderWorkoutCard(logs){
  const sessions = getWorkoutSessions();
  if(sessions===null){
    return `<div class="card">
      <div class="sectionlabel" style="margin-top:0;">Workouts</div>
      <div class="empty">No workout data found in this browser. This only works if this app and your workout tracker are hosted under the same domain (carthasiddiqui.github.io) and you've opened the workout app at least once in this browser.</div>
    </div>`;
  }
  if(sessions.length===0){
    return `<div class="card"><div class="sectionlabel" style="margin-top:0;">Workouts</div><div class="empty">Workout data found, but no sessions logged yet.</div></div>`;
  }
  const stats = workoutStats(logs);
  function row(label, s){
    if(s.exposed.n===0) return `<div class="trigrow"><div class="name">${label}</div><div class="rate">no sessions yet</div></div>`;
    const pct=Math.round(s.exposed.mean*100), lo=Math.round(s.exposed.low*100), hi=Math.round(s.exposed.high*100);
    return `<div class="trigrow"><div class="name">${label}</div><div class="rate">~${pct}% (${lo}–${hi}%) over ${s.exposed.n}×</div></div>`;
  }
  const totalVol = sessions.reduce((a,s)=>a+getSessionVolume(s),0);
  const avgVol = sessions.length? Math.round(totalVol/sessions.length) : 0;
  const exerciseNames = getAllExerciseNames();
  const exercisePicker = exerciseNames.length ? `
    <div class="sectionlabel">By specific exercise</div>
    <select onchange="setSelectedExercise(this.value)" style="width:100%;border:1.5px solid var(--line);border-radius:10px;padding:10px;font-family:'Inter',sans-serif;font-size:0.9rem;">
      <option value="">Choose an exercise…</option>
      ${exerciseNames.map(n=>`<option value="${n.replace(/"/g,'')}" ${SELECTED_EXERCISE===n?'selected':''}>${n}</option>`).join('')}
    </select>
    ${SELECTED_EXERCISE ? exerciseRow(SELECTED_EXERCISE, logs) : `<p class="qhint" style="margin-top:6px;">Note: exercises rotate in and out across your 12-week program's phases, so "does X exercise appear" is partly confounded with "how far into the program" — worth keeping in mind if something shows up here.</p>`}
  ` : '';
  return `<div class="card">
    <div class="sectionlabel" style="margin-top:0;">Workouts</div>
    ${row('Workout days (any gym)', stats.any)}
    ${row('Home gym days', stats.home)}
    ${row('Away gym days', stats.away)}
    ${row('Jubail gym days', stats.jubail)}
    <p class="qhint" style="margin-top:8px;">${sessions.length} workout sessions found, average volume ~${avgVol} (weight × reps summed). Same episode-collapsing as other triggers — a multi-day headache streak after one workout only counts once.</p>
    ${exercisePicker}
  </div>`;
}
function exerciseRow(name, logs){
  const stats = exerciseStats(logs, name);
  const e = stats.exposed, b = stats.unexposed;
  if(e.n===0) return `<div class="empty">No sessions with ${name} logged yet.</div>`;
  const pct=Math.round(e.mean*100), lo=Math.round(e.low*100), hi=Math.round(e.high*100);
  const bpct = b.n? Math.round(b.mean*100)+'%' : '—';
  return `<div class="trigrow"><div class="name">${name} days</div><div class="rate">~${pct}% (${lo}–${hi}%) over ${e.n}× vs ${bpct} other days</div></div>`;
}

function buildRankedCandidates(logs, w){
  const candidates = [];
  const tripIds = ['trip_away','travel_day','jet_lag'];
  allTriggerIds(logs).forEach(id=>{
    const stats = triggerStats(logs, id);
    if(stats.exposed.n>=2 && stats.unexposed.n>=1){
      const nm = (w[id] && w[id].name) || (POOL_MAP[id] && POOL_MAP[id].name) || id;
      candidates.push({ name: nm, category: tripIds.includes(id) ? 'Trip' : 'Trigger', stats });
    }
  });
  const wstats = workoutStats(logs);
  [['Any workout day', wstats.any],['Home gym days', wstats.home],['Away gym days', wstats.away],['Jubail gym days', wstats.jubail]].forEach(([label, s])=>{
    if(s.exposed.n>=2 && s.unexposed.n>=1) candidates.push({ name: label, category:'Workout', stats:s });
  });
  getAllExerciseNames().forEach(name=>{
    const stats = exerciseStats(logs, name);
    if(stats.exposed.n>=2 && stats.unexposed.n>=1) candidates.push({ name, category:'Exercise', stats });
  });
  candidates.forEach(c=> c.diff = c.stats.exposed.mean - c.stats.unexposed.mean);
  candidates.sort((a,b)=> Math.abs(b.diff)-Math.abs(a.diff));
  return candidates.slice(0,8);
}
function renderRankedCard(logs, w){
  const candidates = buildRankedCandidates(logs, w);
  if(candidates.length===0){
    return `<div class="card"><div class="sectionlabel" style="margin-top:0;">Worth a closer look</div><div class="empty">Not enough paired data yet — with headaches this infrequent it takes a few weeks of daily check-ins (including the days with nothing to report) before anything can be compared.</div></div>`;
  }
  function line(c){
    const e=c.stats.exposed, b=c.stats.unexposed;
    const pct=Math.round(e.mean*100), bpct = b.n? Math.round(b.mean*100)+'%':'—';
    const dirWord = c.diff>0 ? 'higher' : 'lower';
    return `<div class="trigrow"><div class="name">${c.name}<div class="qhint" style="margin:0;">${c.category}</div></div><div class="rate">${pct}% vs ${bpct}<br>${Math.abs(Math.round(c.diff*100))}pt ${dirWord}, ${e.n}× vs ${b.n}×</div></div>`;
  }
  return `<div class="card">
    <div class="sectionlabel" style="margin-top:0;">Worth a closer look</div>
    <p class="qhint">Triggers, trip days, gym modes and exercises with at least 2 exposed and 1 unexposed day, ranked by the size of the gap — exploratory, not the same as the confirmed bar further down.</p>
    ${candidates.map(line).join('')}
  </div>`;
}

/* ---------------- Insights ---------------- */
async function renderInsights(){
  const logs = await getAllLogs();
  const entries = Object.values(logs);
  const w = await getWatchlist();
  const total = entries.length;
  const counted = entries.filter(isCounted).length;
  const modDays = entries.filter(isModerate).length;
  const minorDays = entries.filter(l=>l.headache && l.headache.had && !isModerate(l)).length;
  const baseRate = total? counted/total : 0;
  const nameOf = id => (w[id] && w[id].name) || (POOL_MAP[id] && POOL_MAP[id].name) || id;

  const rows = allTriggerIds(logs).map(id=>{
    const stats = triggerStats(logs, id);
    return { id, name: nameOf(id), status: classifyTrigger(stats), stats };
  }).filter(r=>r.stats.exposed.n>=1);
  const confirmed = rows.filter(r=>r.status==='confirmed');
  const watching = rows.filter(r=>r.status==='watching' && r.stats.exposed.n>=2 && r.stats.unexposed.n>=1)
    .sort((a,b)=>b.stats.exposed.n-a.stats.exposed.n).slice(0,8);
  const ruledOut = rows.filter(r=>r.status==='ruled_out');
  const constant = rows.filter(r=>r.stats.exposed.n>=3 && r.stats.unexposed.n===0);

  function rateLine(r){
    const e = r.stats.exposed;
    const pct = Math.round(e.mean*100), lo = Math.round(e.low*100), hi = Math.round(e.high*100);
    return `<div class="trigrow"><div class="name">${r.name}</div><div class="rate">~${pct}% (${lo}–${hi}%) over ${e.n}× <span class="flag ${r.status}">${r.status.replace('_',' ')}</span></div></div>`;
  }

  const WATER_MAP = {'0–1':0.5,'2–3':2.5,'4–5':4.5,'6+':6};
  const CAF_MAP = {'0 cups':0,'1 cup':1,'2 cups':2,'3 cups':3,'4+ cups':4};
  function factorRow(label, unit, hv, nv){
    if(hv.length<3 || nv.length<3) return `<div class="trigrow"><div class="name">${label}</div><div class="rate">need more data (${hv.length} headache vs ${nv.length} other days)</div></div>`;
    const avg = arr=> (arr.reduce((a,b)=>a+b,0)/arr.length);
    return `<div class="trigrow"><div class="name">${label}</div><div class="rate">${avg(hv).toFixed(1)}${unit} before headaches vs ${avg(nv).toFixed(1)}${unit} otherwise</div></div>`;
  }
  // sleep + pillow describe the night that ends on the wake-up date, so they pair with that date's headache
  function morningLine(label, unit, extract){
    const hv=[], nv=[];
    entries.forEach(l=>{ const v = extract(l); if(v===undefined||v===null) return; (isCounted(l)?hv:nv).push(v); });
    return factorRow(label, unit, hv, nv);
  }
  // stress / water / caffeine describe the day, so they pair with headaches that began after them
  const units = buildOccasions(logs);
  function dayLine(label, unit, extract){
    const hv=[], nv=[];
    units.forEach(u=>{ const v = extract(logs[u.dates[0]]); if(v===undefined||v===null) return; (u.headache?hv:nv).push(v); });
    return factorRow(label, unit, hv, nv);
  }

  return `<header class="top"><h1>Patterns</h1></header>
  <div class="statgrid">
    <div class="stat"><div class="n">${total}</div><div class="l">days logged</div></div>
    <div class="stat"><div class="n">${Math.round(baseRate*100)}%</div><div class="l">baseline headache rate</div></div>
  </div>

  <div class="card">
    <div class="sectionlabel" style="margin-top:0;">What counts as a headache?</div>
    <div class="pillrow">
      ${pill('Bothersome only (3+ or needed a pill)', minSev()>=3, 'setMinSeverity(3)')}
      ${pill('Everything, even minor', minSev()<3, 'setMinSeverity(1)')}
    </div>
    <p class="qhint" style="margin-top:8px;">${modDays} bothersome day${modDays===1?'':'s'} and ${minorDays} minor so far. Minor ones are noisier, so the comparisons default to bothersome only.${(modDays<4 && minorDays>=3 && minSev()>=3)? ' <b>With this few bothersome headaches there is little to compare — switching to "Everything" gives the analysis more to work with.</b> Once you are mostly headache-free, "Everything" is the right setting, since then the minor ones are what is left to explain.' : ''}</p>
  </div>

  ${renderRankedCard(logs, w)}

  ${renderPillowCard(entries)}

  ${renderOnsetCard(entries)}

  <div class="card">
    <div class="sectionlabel" style="margin-top:0;">Daily factors</div>
    ${morningLine('Sleep score','', l=>l.sleepScore)}
    ${dayLine('Stress (1–5)','', l=>l.stress)}
    ${dayLine('Water','glasses', l=>WATER_MAP[l.water])}
    ${dayLine('Caffeine','cups', l=>CAF_MAP[l.caffeine])}
  </div>

  ${renderMedCard(entries)}

  ${renderPinnedCard(w)}

  ${renderWorkoutCard(logs)}

  ${renderTrialsCard(logs)}

  <div class="card">
    <div class="sectionlabel" style="margin-top:0;">Likely triggers</div>
    ${confirmed.length? confirmed.map(rateLine).join('') : `<div class="empty">None flagged yet — keep logging. Usually needs several data points before the range narrows enough to say.</div>`}

    <div class="sectionlabel">Still watching</div>
    ${watching.length? watching.map(rateLine).join('') : `<div class="empty">Nothing with enough exposed and unexposed days yet.</div>`}

    <div class="sectionlabel">Ruled out</div>
    ${ruledOut.length? ruledOut.map(rateLine).join('') : `<div class="empty">Nothing ruled out yet.</div>`}

    ${constant.length? `<p class="qhint" style="margin-top:10px;">Too constant to compare (almost always "yes"): ${constant.map(r=>r.name).join(', ')}. An elimination trial is the way to test those.</p>` : ''}

    <button class="addbtn" onclick="promptAddTrigger()">+ Add something to watch manually</button>
  </div>
  <p class="qhint" style="padding:0 4px;">How this works: each day is paired with whether a new headache began after it — later that day, or as a waking headache the next morning. Days already inside a multi-day headache aren't counted again, and the most recent day waits until the next day is logged. Percentages are headache rate when exposed; the range narrows as data comes in, and a wide range just means "too early to tell." Correlation, not proof.</p>
  `;
}

async function promptAddTrigger(){
  const name = prompt('What would you like to start watching? (e.g. "almonds", "flying")');
  if(!name) return;
  const id = 'custom_'+name.toLowerCase().replace(/[^a-z0-9]+/g,'_').slice(0,30)+'_'+Date.now();
  POOL_MAP[id] = {id, name, cat:'Food'};
  const w = await getWatchlist();
  w[id] = {id, name, added:todayStr(), lastAsked:'2000-01-01', custom:true};
  await saveWatchlist(w);
  render();
}

let EXPANDED_DATE = null;
function toggleHistoryDetail(date){ EXPANDED_DATE = (EXPANDED_DATE===date) ? null : date; render(); }
function renderHistoryDetail(log){
  const hide = ['trip_away','travel_day','jet_lag'];
  const nm = id => (STORE.watchlist[id] && STORE.watchlist[id].name) || (POOL_MAP[id] && POOL_MAP[id].name) || id;
  const ex = log.exposures || {};
  const yesItems = Object.keys(ex).filter(id=>ex[id]===true && !hide.includes(id)).map(nm);
  const noItems = Object.keys(ex).filter(id=>ex[id]===false && !hide.includes(id)).map(nm);
  const h = log.headache || {};
  const onsetLbl = {woke:'woke with it', early:'1–3h after waking', mid:'4–8h after waking', late:'9h+ after waking'}[h.onsetSinceWake] || h.onsetTime || '—';
  const tripLbl = {home:'at home', away:'away from home', transit:'travel day', recovering:'back home, jet-lagged'}[log.trip];
  return `<div style="padding:8px 2px 16px;border-bottom:1px solid var(--line);font-size:0.85rem;">
    <div class="qhint" style="margin:0 0 6px;">Sleep score: ${log.sleepScore??'—'} · Pillow: ${log.pillow||'—'} · Stress: ${log.stress??'—'}/5</div>
    <div class="qhint" style="margin:0 0 6px;">Water: ${log.water||'—'} · Caffeine: ${log.caffeine||'—'}${log.caffeineChange?' ('+log.caffeineChange+')':''}</div>
    ${tripLbl? `<div class="qhint" style="margin:0 0 6px;">Trip: ${tripLbl}</div>` : ''}
    ${h.had? `<div class="qhint" style="margin:0 0 6px;">Started: ${onsetLbl}${(h.meds&&h.meds.length)? ' · Took: '+h.meds.join(', ')+(h.medHelped?' (helped: '+h.medHelped.toLowerCase()+')':'') : ''}</div>` : ''}
    <div class="qhint" style="margin:0 0 6px;"><b>Marked yes:</b> ${yesItems.length? yesItems.join(', ') : 'none'}</div>
    ${noItems.length? (noItems.length<=8? `<div class="qhint" style="margin:0 0 6px;"><b>Marked no:</b> ${noItems.join(', ')}</div>` : `<div class="qhint" style="margin:0 0 6px;"><b>Marked no:</b> ${noItems.length} other items</div>`) : ''}
    ${log.notes? `<div class="qhint" style="margin:0 0 6px;"><b>Notes:</b> ${log.notes}</div>` : ''}
    <span class="linkbtn" onclick="startEditDay('${log.date}')">Edit this day</span>
    <div style="display:flex;gap:8px;margin-top:12px;align-items:center;">
      <input type="date" id="moveDateInput-${log.date}" max="${todayStr()}" style="flex:1;border:1.5px solid var(--line);border-radius:8px;padding:8px;font-family:'Inter',sans-serif;font-size:0.85rem;">
      <div class="pill small" onclick="moveEntryToDate('${log.date}', document.getElementById('moveDateInput-${log.date}').value)">Move to this date</div>
    </div>
  </div>`;
}
function applyTrip(log, trip){
  log.trip = trip;
  log.exposures = {...(log.exposures||{}), trip_away:(trip==='away'||trip==='transit'), travel_day:(trip==='transit'), jet_lag:(trip==='recovering')};
}
function tagTripDays(){
  const st = document.getElementById('tripStart').value, en = document.getElementById('tripEnd').value, t = document.getElementById('tripType').value;
  if(!st || !en || en<st){ alert('Pick a start date and an end date on or after it.'); return; }
  let n = 0;
  Object.keys(STORE.logs).sort().forEach(d=>{
    if(d<st || d>en) return;
    const v = (t==='whole') ? ((d===st || d===en) ? 'transit' : 'away') : t;
    applyTrip(STORE.logs[d], v); n++;
  });
  persist();
  alert('Tagged '+n+' logged day'+(n===1?'':'s')+'.');
  render();
}
function moveEntryToDate(oldDate, newDate){
  if(!newDate || newDate===oldDate) return;
  if(STORE.logs[newDate]){
    if(!confirm(`There's already an entry for ${newDate}. Overwrite it with this one?`)) return;
  }
  STORE.logs[newDate] = { ...STORE.logs[oldDate], date: newDate };
  delete STORE.logs[oldDate];
  persist();
  EXPANDED_DATE = newDate;
  render();
}

/* ---------------- History ---------------- */
async function renderHistory(){
  const logs = await getAllLogs();
  const dates = Object.keys(logs).sort().reverse();
  return `<header class="top"><h1>History</h1></header>
  <div class="card">
    <div class="sectionlabel" style="margin-top:0;">Backup</div>
    <p class="qhint">Your data saves automatically on this device. Use this only if you want a safety-net copy or to move your history to another device/browser.</p>
    <div class="pillrow">
      <div class="pill" onclick="exportBackup()">Download backup (.json)</div>
      <div class="pill" onclick="triggerImport()">Import backup</div>
    </div>
    <input type="file" id="backupFileInput" accept="application/json" style="display:none" onchange="importBackup(this)">
    <div class="sectionlabel">Export as spreadsheet</div>
    <p class="qhint">A read-only CSV, handy for your own analysis — not used to restore data.</p>
    <button class="addbtn" onclick="exportCSV()">Export CSV</button>
  </div>
  <div class="card">
    <div class="sectionlabel" style="margin-top:0;">Tag past days as a trip</div>
    <p class="qhint">Sets trip status on days you've already logged. "Whole trip" marks the first and last day as travel days and everything between as away. Add extra travel days or jet-lag days with the other options.</p>
    <div style="display:flex;gap:8px;">
      <input type="date" id="tripStart" style="flex:1;border:1.5px solid var(--line);border-radius:8px;padding:8px;font-family:'Inter',sans-serif;font-size:0.85rem;">
      <input type="date" id="tripEnd" style="flex:1;border:1.5px solid var(--line);border-radius:8px;padding:8px;font-family:'Inter',sans-serif;font-size:0.85rem;">
    </div>
    <select id="tripType" style="width:100%;margin-top:8px;border:1.5px solid var(--line);border-radius:8px;padding:10px;font-family:'Inter',sans-serif;font-size:0.9rem;">
      <option value="whole">Whole trip (first &amp; last day = travel days)</option>
      <option value="away">Away from home</option>
      <option value="transit">Travel day</option>
      <option value="recovering">Back home, jet-lagged</option>
      <option value="home">At home</option>
    </select>
    <button class="addbtn" onclick="tagTripDays()">Apply to logged days in that range</button>
  </div>
  <div class="card">
    <div class="sectionlabel" style="margin-top:0;">Entries</div>
    ${dates.length? dates.map(d=>{
      const l = logs[d];
      const expanded = EXPANDED_DATE===d;
      const row = `<div class="histentry" style="cursor:pointer;" onclick="toggleHistoryDetail('${d}')"><span class="d">${d}</span><span>${l.headache&&l.headache.had? '⚠ headache ('+(l.headache.severity||'')+'/10'+(isModerate(l)?'':', minor')+')' : 'no headache'}</span></div>`;
      return row + (expanded? renderHistoryDetail(l) : '');
    }).join('') : `<div class="empty">No entries yet.</div>`}
  </div>`;
}

async function exportCSV(){
  const logs = await getAllLogs();
  const idSet = new Set(Object.keys(STORE.watchlist));
  Object.values(logs).forEach(l=>Object.keys(l.exposures||{}).forEach(id=>idSet.add(id)));
  const trigIds = [...idSet];
  const headers = ['date','headache','severity','onsetSinceWake','onsetTime','continuation','meds','medHelped','trip','sleepScore','pillow','stress','water','caffeine','caffeineChange',...trigIds,'notes'];
  const q = v => `"${String(v==null?'':v).replace(/"/g,'""')}"`;
  const rows = [headers.join(',')];
  Object.keys(logs).sort().forEach(d=>{
    const l = logs[d], h = l.headache || {};
    const row = [
      d, h.had?'yes':'no', h.severity||'', h.onsetSinceWake||'', h.onsetTime||'',
      h.continuation===true?'continuing': h.continuation===false?'new':'',
      q((h.meds||[]).join('; ')), h.medHelped||'', l.trip||'',
      l.sleepScore??'', q(l.pillow||''), l.stress||'', l.water||'', l.caffeine||'', l.caffeineChange||'',
      ...trigIds.map(id=> l.exposures && l.exposures[id]===true?'yes': l.exposures && l.exposures[id]===false?'no':''),
      q(l.notes||'')
    ];
    rows.push(row.join(','));
  });
  const blob = new Blob([rows.join('\n')], {type:'text/csv'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'headache-log.csv';
  a.click();
}

render();
</script>
</body>
</html>
